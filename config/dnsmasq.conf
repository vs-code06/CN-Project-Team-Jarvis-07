# dnsmasq configuration — Mac 1 (10.7.12.6)
# Private DNS server for Team Jarvis 07

# Listen on localhost and the LAN IP
listen-address=127.0.0.1,10.7.12.6

# Bind only to the specified interfaces
bind-interfaces

# Do not use /etc/resolv.conf for upstream DNS
no-resolv

# Domain-to-IP mappings
# Both domains resolve to Mac 2 (nginx reverse proxy)
address=/app.team1.test/10.7.3.73
address=/api.team1.test/10.7.3.73
